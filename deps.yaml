dependencies:
  bun.sh: ^1.3.11
  # The webview the VPN app is drawn in. Bundled into the .app by
  # packages/buddyvpn/scripts/build-app.ts, which resolves it from pantry/.
  #
  # Exact, and not the range it looks like: a caret on a 0.0.x version
  # permits only that patch, so `^0.0.90` was pinning one build while
  # reading as a range. Written plainly now to stop that being rediscovered.
  #
  # 0.0.359 for `--tray-popover`, which arrived in 0.0.98 and is what makes
  # the menu bar work at all here. On 0.0.90 a left click on the status item
  # is handed to JavaScript and never arrives (craft-native/craft#420), so
  # nothing in the bar could be clicked; a popover opens natively and never
  # involves the page, so the bug does not apply to it.
  craft-native.org: 0.0.359
  # The native VPN core (packages/vpn-core) is Zig. `bun run build:native`
  # needs it, and so does `deploy:vpn`, which cross-compiles libltvpn.so for
  # the server mid-deploy — without it the box is provisioned and the build
  # then fails, leaving a half-configured server you are already paying for.
  # Pinned to an exact dev build, not a range.
  #
  # Zig has no 0.18 release — every 0.18 is a prerelease, and `^0.18` matches
  # none of them, because a caret range excludes prereleases unless it carries
  # one itself. That spec resolved on this machine, where an older pantry falls
  # back to downloading from ziglang.org, and failed the first release that
  # reached CI with the newer resolver: "No version of ziglang.org satisfies
  # ^0.18 (checked 24 versions, newest 0.18.0-dev.610+720939f8c)".
  #
  # Exact rather than `>=0.18.0-dev`, which would resolve to whatever is newest
  # that hour. This is a compiler whose APIs move between dev builds — the
  # commit above this one in `git log -- deps.yaml` exists because Zig changed
  # X25519 key generation — so a range here means the build can break with no
  # change of ours. Verified: packages/vpn-core builds clean against this one.
  ziglang.org: 0.18.0-dev.610+720939f8c
