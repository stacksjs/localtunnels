name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Use cached node_modules
        uses: actions/cache@v5.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Use cached node_modules
        uses: actions/cache@v5.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Typecheck
        run: bun --bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Use cached node_modules
        uses: actions/cache@v5.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Unit Test
        run: bun test

  publish-commit:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    # Gated on a repo variable (same pattern as ts-cloud) so a stale
    # PANTRY_TOKEN doesn't keep main permanently red.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PANTRY_PUBLISH_COMMITS == 'true'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Pinned, and pinned to the same version the system-cleaner app uses.
      #
      # This was `home-lang/pantry/packages/action@main` — the same repository
      # under its old name, so the move is a rename, not a change of action.
      # The pin is the point: that repository is a package catalog whose main
      # branch moves many times a day, so `@main` meant two runs an hour apart
      # could execute different code, and a release pipeline that changes
      # under you is one that cannot be bisected when it breaks.
      #
      # v0.11.80 exists and its action is byte-identical in behaviour — every
      # commit between the two is a catalog update, and the only file touched
      # under packages/action is its own package.json. Held here so both
      # repositories move together.
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@v0.11.152

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish Commit
        run: pantry publish:commit './packages/*'
        env:
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
