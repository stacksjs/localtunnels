name: VPN

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Native Zig core: unit tests, wire-correctness KATs, and fuzz tests. Also
  # re-runs the independent Python reference so its RFC self-tests are checked.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Reference implementation self-test
        run: python3 packages/vpn-core/testvectors/wg_ref.py > /dev/null

      - name: Zig unit + KAT + fuzz tests
        run: cd packages/vpn-core && zig build test

      - name: Build shared library
        run: cd packages/vpn-core && zig build

      - name: Upload libltvpn
        uses: actions/upload-artifact@v4
        with:
          name: libltvpn-linux
          path: packages/vpn-core/zig-out/lib/*

  # Every target the release ships a library for must keep building. Windows
  # silently did not: the packet pump referenced libc's `__error`, a POSIX
  # errno accessor that does not exist there, and the whole library failed to
  # link with `lld-link: undefined symbol: __error`. Nothing caught it because
  # nothing built for Windows, and the docs claimed Windows support in the
  # native core the entire time.
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu.2.31
          - aarch64-linux-gnu.2.31
          - x86_64-windows
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Build libltvpn for ${{ matrix.target }}
        run: cd packages/vpn-core && zig build -Dtarget=${{ matrix.target }} --prefix "$RUNNER_TEMP/out"

      - name: Check a library was produced
        run: |
          found=$(find "$RUNNER_TEMP/out" -name 'ltvpn.dll' -o -name 'libltvpn.*' | head -1)
          if [ -z "$found" ]; then
            echo "::error::no shared library produced for ${{ matrix.target }}"
            exit 1
          fi
          echo "ok: $found"

  # TypeScript suite with the native library present, so the VPN datapath /
  # coordinator / relay e2e tests actually run (rather than skip).
  vpn-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.1.3

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Install Dependencies
        run: bun install

      - name: Build native library
        run: cd packages/vpn-core && zig build

      - name: VPN e2e tests
        # The native lib is built, so the VPN datapath / coordinator / relay /
        # raw / routing tests all run here rather than skip.
        run: bun test

      - name: VPN self-check via CLI
        run: |
          bun run packages/localtunnels/bin/cli.ts vpn:selftest
          bun run packages/localtunnels/bin/cli.ts vpn:demo --count 100
          bun run packages/localtunnels/bin/cli.ts vpn:mesh-demo --count 100

      # Real TUN device test needs CAP_NET_ADMIN — run it as root. The test
      # skips itself if the device can't be created, so this never flakes.
      - name: Routed TUN device test (root)
        run: sudo -E env "PATH=$PATH" bun test packages/localtunnels/test/vpn.tun-root.test.ts
