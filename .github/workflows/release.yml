name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@main

      - name: Install Dependencies
        run: bun install

      - name: Build Packages
        run: bun run build

      # Gate the publish on the same checks CI runs — a tagged release must
      # never ship code that fails typecheck or tests.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Compile Binaries
        run: bun run compile:all && bun run zip

      - name: Publish
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.9
        with:
          files: |
            bin/localtunnels-linux-x64.zip
            bin/localtunnels-linux-arm64.zip
            bin/localtunnels-windows-x64.zip
            bin/localtunnels-darwin-x64.zip
            bin/localtunnels-darwin-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
